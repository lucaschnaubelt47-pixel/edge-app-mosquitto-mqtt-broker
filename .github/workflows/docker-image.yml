
name: Build IXON Mosquitto ARM64

on:
  workflow_dispatch:

jobs:
  build-mosquitto:
    name: Build Mosquitto for ARM64/v8
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/arm64/v8 \
            --file Dockerfile \
            --tag mosquitto:ixon-arm64-v8 \
            --output type=docker,dest=/tmp/mosquitto.tar \
            .

      - name: Compress Docker image
        run: |
          gzip -9 /tmp/mosquitto.tar
          mv /tmp/mosquitto.tar.gz \
             /tmp/ixon-mosquitto-arm64-v8.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: ixon-mosquitto-arm64-v8
          path: /tmp/ixon-mosquitto-arm64-v8.tar.gz
          retention-days: 7
