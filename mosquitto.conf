# IXON – Mosquitto MQTT Broker
# Production and Rework Station
# Version 0.1.0

# Keine anonymen Verbindungen
allow_anonymous false

# Benutzeranmeldung
password_file /mosquitto/config/passwordfile

# MQTT im lokalen Maschinennetz
listener 1883
protocol mqtt

# Nachrichten dauerhaft speichern
persistence true
persistence_location /mosquitto/data/

# Protokollierung
log_dest stdout
log_type error
log_type warning
log_type notice
